<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231d4ed8'/%3E%3Cpath transform='translate(3.8 4.2) scale(.88)' fill='%23f5f8ff' fill-rule='evenodd' d='M20 12H44A12 12 0 0 1 55.9 22.4L59.5 43A8 8 0 0 1 45.9 49.6L40.5 44A4 4 0 0 0 37.6 42.8H26.4A4 4 0 0 0 23.5 44L18.1 49.6A8 8 0 0 1 4.5 43L8.1 22.4A12 12 0 0 1 20 12ZM16.5 20h5v4.5H26v5h-4.5V34h-5v-4.5H12v-5h4.5zM40 22h12v3H40zM40 28h9v3H40zM40 34h6v3H40z'/%3E%3C/svg%3E"
        />
        <title>GameQueue</title>
        <style>
            /* Splash shown until the app mounts; React replaces #root's contents. While the app
               waits for /api/auth/me it renders the same markup (components/Splash.tsx), passing
               --splash-t (seconds since page load) so the animations carry on instead of restarting. Inline so it
               paints before any script or stylesheet arrives. Colours mirror tokens.css. */
            html {
                background: #f3f6fb;
                --splash-accent: #1d4ed8;
                --splash-bg: #f3f6fb;
            }
            @media (prefers-color-scheme: dark) {
                html {
                    background: #0d1320;
                    --splash-accent: #6ea0ff;
                    --splash-bg: #0d1320;
                }
            }
            body {
                margin: 0;
            }
            .splash {
                min-height: 100vh;
                display: grid;
                place-content: center;
                color: var(--splash-accent);
                /* Stay invisible for a moment so a fast load never flashes it */
                opacity: 0;
                animation: splash-in 0.6s ease-out calc(0.25s - var(--splash-t, 0s)) forwards;
            }
            .splash svg {
                width: clamp(140px, 22vmin, 200px);
                height: clamp(140px, 22vmin, 200px);
                fill: currentColor;
                opacity: 0.5;
                animation: splash-pulse 2.4s ease-in-out calc(0s - var(--splash-t, 0s)) infinite;
            }
            /* The queue lights up one bar after another */
            .splash .bar-0,
            .splash .bar-1,
            .splash .bar-2 {
                animation: splash-blink 2.4s ease-in-out calc(0s - var(--splash-t, 0s)) infinite;
            }
            .splash .bar-1 {
                animation-delay: calc(0.3s - var(--splash-t, 0s));
            }
            .splash .bar-2 {
                animation-delay: calc(0.6s - var(--splash-t, 0s));
            }
            /* Hand-over to the app (components/Splash.tsx): the mark shrinks away, then this veil
               lifts while #root fades in underneath */
            .splash--leaving {
                position: fixed;
                inset: 0;
                z-index: 100;
                opacity: 1;
                background: var(--bg, var(--splash-bg));
                animation: splash-veil 0.45s ease-out 0.3s forwards;
            }
            .splash--leaving svg {
                animation: splash-out 0.35s cubic-bezier(0.5, 0, 0.75, 0) forwards;
            }
            .root-enter {
                animation: root-in 0.45s ease-out 0.3s backwards;
            }
            @keyframes splash-out {
                to {
                    transform: scale(0.5);
                    opacity: 0;
                }
            }
            @keyframes splash-veil {
                to {
                    opacity: 0;
                }
            }
            @keyframes root-in {
                from {
                    opacity: 0;
                }
            }
            @keyframes splash-in {
                to {
                    opacity: 1;
                }
            }
            @keyframes splash-pulse {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 0.35;
                }
                50% {
                    transform: scale(1.04);
                    opacity: 0.7;
                }
            }
            @keyframes splash-blink {
                0%,
                100% {
                    opacity: 0.3;
                }
                40% {
                    opacity: 1;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .splash svg,
                .splash--leaving,
                .root-enter,
                .splash .bar-0,
                .splash .bar-1,
                .splash .bar-2 {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="root">
            <div class="splash" role="status" aria-label="Loading GameQueue">
                <svg viewBox="-2 -1 68 68" aria-hidden="true">
                    <mask id="splash-cut">
                        <path
                            d="M20 12H44A12 12 0 0 1 55.9 22.4L59.5 43A8 8 0 0 1 45.9 49.6L40.5 44A4 4 0 0 0 37.6 42.8H26.4A4 4 0 0 0 23.5 44L18.1 49.6A8 8 0 0 1 4.5 43L8.1 22.4A12 12 0 0 1 20 12Z"
                            fill="#fff"
                        />
                        <path d="M16.5 20h5v4.5H26v5h-4.5V34h-5v-4.5H12v-5h4.5z" fill="#000" />
                        <path class="bar-0" d="M40 22h12v3H40z" fill="#000" />
                        <path class="bar-1" d="M40 28h9v3H40z" fill="#000" />
                        <path class="bar-2" d="M40 34h6v3H40z" fill="#000" />
                    </mask>
                    <rect x="-2" y="-1" width="68" height="68" mask="url(#splash-cut)" />
                </svg>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
