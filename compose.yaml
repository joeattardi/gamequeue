# GameQueue + Cloudflare Tunnel. See DEPLOYMENT.md. Settings come from .env next to this file.
services:
    gamequeue:
        image: ghcr.io/joeattardi/gamequeue:latest
        build: .
        restart: unless-stopped
        environment:
            NODE_ENV: production
            # Only cloudflared can reach the app (no published ports), so X-Forwarded-For comes from the tunnel
            TRUST_PROXY: 'true'
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
            PUBLIC_URL: ${PUBLIC_URL:-}
            SIGNUPS_ENABLED: ${SIGNUPS_ENABLED:-true}
            IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
            IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
            ITAD_API_KEY: ${ITAD_API_KEY:-}
            ITAD_COUNTRY: ${ITAD_COUNTRY:-US}
            CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
            CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
            CLOUDFLARE_ANALYTICS_URL: ${CLOUDFLARE_ANALYTICS_URL:-}
            FOUNDER_USER_ID: ${FOUNDER_USER_ID:-}
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
            NOTIFY_FROM: ${NOTIFY_FROM:-GameQueue <onboarding@resend.dev>}
        volumes:
            - ./data:/data

    cloudflared:
        image: cloudflare/cloudflared:latest
        restart: unless-stopped
        command: tunnel --no-autoupdate run
        environment:
            TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
        depends_on:
            gamequeue:
                condition: service_healthy
